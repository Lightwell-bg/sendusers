# ВАЖНО (на VPS перед запуском):
# 1. Маунты баз ботов асимметричны — под то, как они реально лежат на хосте:
#    - Бот A: ${BOT_A_DATA_DIR} — каталог (у bginfobot это /opt/bginfobot/data,
#      там лежит только bot_data.sqlite, ничего лишнего) — монтируем каталог
#      целиком, чтобы были видны служебные файлы SQLite (-journal/-wal/-shm),
#      если они появятся.
#    - Бот B: ${BOT_B_DB_HOST_PATH} — ОДИН ФАЙЛ chat_logs.db. У bginfoai этот
#      файл лежит прямо в корне проекта рядом с исходным кодом и его .env
#      (там токен бота B) — монтировать всю папку сюда нельзя, это отдаст
#      чужие секреты внутрь контейнера рассылок. Монтируем только сам файл.
#    Проверено (2026-07-06): у обеих БД нет -wal/-shm/-journal файлов в покое
#    (обычный journal_mode=DELETE, не WAL) — точечный файловый маунт для B безопасен.
# 2. Если на вашей конфигурации chat_logs.db всё же не примонтирован на хост
#    из контейнера бота B (проверить `docker inspect <контейнер_бота_B>` -> Mounts) —
#    сначала добавьте бинд-маунт в docker-compose бота B и пересоздайте его контейнер.
# 3. Сервис должен работать строго в ОДИН процесс (никаких uvicorn --workers > 1):
#    защита от двойного запуска кампании держится на in-process реестре задач.
services:
  broadcast-admin:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
      - ${BOT_A_DATA_DIR:-../bginfobot/data}:/dbs/bot_a:ro
      - ${BOT_B_DB_HOST_PATH:-../bginfoai/chat_logs.db}:/dbs/bot_b/chat_logs.db:ro
    restart: unless-stopped
