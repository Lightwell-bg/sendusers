# ВАЖНО (на VPS перед запуском):
# 1. Маунты баз ботов теперь симметричны — оба каталогами:
#    - Бот A: ${BOT_A_DATA_DIR} (у bginfobot — /opt/bginfobot/data, там только
#      bot_data.sqlite, ничего лишнего).
#    - Бот B: ${BOT_B_DATA_DIR} (у bginfoai — /opt/bginfoai/data; раньше
#      chat_logs.db лежал прямо в корне проекта рядом с .env бота B, поэтому
#      монтировали только сам файл — с 2026-09 бот B хранит базу в отдельном
#      data/, как и бот A, монтировать всю папку /opt/bginfoai по-прежнему
#      НЕЛЬЗЯ (там код и .env с токеном бота B), а вот data/ — можно).
#    Монтируем каталогом, а не файлом, ещё и потому что бот B работает в
#    SQLite WAL-режиме: файлу chat_logs.db сопутствуют chat_logs.db-wal и
#    chat_logs.db-shm, без которых read-only чтение падает с "disk I/O error" —
#    точечный маунт одного файла их не подхватывает, каталог подхватывает.
# 2. Если на вашей конфигурации data/ бота B всё же не примонтирован на хост
#    из его контейнера (проверить `docker inspect <контейнер_бота_B>` -> Mounts) —
#    сначала добавьте бинд-маунт в docker-compose бота B и пересоздайте его контейнер.
# 3. Сервис должен работать строго в ОДИН процесс (никаких uvicorn --workers > 1):
#    защита от двойного запуска кампании держится на in-process реестре задач.
# 4. HOST_PORT — порт НА ХОСТЕ (внутри контейнера всегда 8080, см. Dockerfile).
#    На этом VPS уже заняты: 8080 (medvopros-app), 8081 (vetvopros-app),
#    5000 (bginfoai) — выбирайте свободный порт (по умолчанию 8090).
# 5. Порт публикуется на всех интерфейсах (0.0.0.0) — сам вопрос "пускать
#    ли снаружи" решает не docker, а приложение (страница /settings,
#    переключатель хранится в его собственной БД, без правки .env и
#    рестарта контейнера): по умолчанию отказывает всем, кроме
#    локальных/туннельных адресов. См. README_broadcast.md, раздел
#    «Доступ к админке».
services:
  broadcast-admin:
    build: .
    container_name: broadcast-admin
    env_file: .env
    ports:
      - "${HOST_PORT:-8090}:8080"
    volumes:
      - ./data:/app/data
      - ${BOT_A_DATA_DIR:-../bginfobot/data}:/dbs/bot_a:ro
      - ${BOT_B_DATA_DIR:-../bginfoai/data}:/dbs/bot_b:ro
    restart: unless-stopped
